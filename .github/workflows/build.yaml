name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

# Grants the action permission to publish a Release on your repository
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get Latest Commit Message
        id: git_info
        run: echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Automated Build
          body: |
            ### Build Information
            * **Update:** ${{ steps.git_info.outputs.commit_msg }}
            * **Branch:** `${{ github.ref_name }}`
            * **Commit:** `${{ github.sha }}`
            * **Triggered by:** @${{ github.actor }}
            
            Download the `app-debug.apk` below to install this version.
          files: app/build/outputs/apk/debug/*.apk
